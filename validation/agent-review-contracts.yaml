schema_version: 1
schemas:
  agent_execution: plugins/bedrock/skills/agent-code/reference/agent-execution.schema.json
  design_review_result: plugins/bedrock/skills/design-review-loop/reference/design-review-result.schema.json
fixtures:
  valid:
    - tests/fixtures/agent-review-contracts/valid/agent-execution.json
    - tests/fixtures/agent-review-contracts/valid/reviewer-empty.json
    - tests/fixtures/agent-review-contracts/valid/arbitration.json
  invalid:
    - path: tests/fixtures/agent-review-contracts/invalid/ambiguous-salvage.txt
      expected: ambiguous salvage
    - path: tests/fixtures/agent-review-contracts/invalid/low-confidence-resolvable.json
      expected: low-confidence resolvable
required_contract_markers:
  plugins/bedrock/skills/agent-code/SKILL.md:
    - "Never accept “the first parseable payload.”"
    - "One aggregate execution budget"
    - "Content capture is off by default."
  plugins/bedrock/skills/design-review-loop/SKILL.md:
    - "Direct review"
    - "Multi-perspective review"
    - "The consuming product owns workflow meaning"
    - "declared, versioned product-owned runner"
    - "Without fresh evidence that the declared runner/profile executed"
    - "No policy universally dominates."
  plugins/bedrock/skills/design-review-loop/reference/product-runner-binding.md:
    - "runner identity, immutable SemVer"
forbidden_markers:
  - "SOFIA"
  - "recipe/kernel"
  - "control-plane state"
  - "~15 real runs"
  - "salvage the first parseable payload"
  - "Tie goes to the defect"
  - "union strictly dominates"
forbidden_paths:
  - plugins/bedrock/skills/design-review-loop/reference/haffey-sofia-profile.md
runner_profile_cases:
  - id: direct-without-runner
    input: {profile: direct}
    expected: direct-review-complete
  - id: multi-perspective-without-runner
    input: {profile: multi-perspective}
    expected: multi-perspective-review-complete
  - id: runner-backed-complete-binding
    input: {profile: runner-backed, product_binding_id: product-review-workflow, product_binding_version: 1.0.0, runner_id: product-review-runner, runner_version: 2.1.0, schemas_compatible: true, invocation: "product-review run --profile convergence", fresh_gate_evidence: true}
    expected: runner-backed-claim-permitted
  - id: runner-backed-without-product-binding
    input: {profile: runner-backed, runner_id: product-review-runner, runner_version: 2.1.0, schemas_compatible: true, invocation: "product-review run --profile convergence", fresh_gate_evidence: true}
    expected: stop-unavailable
  - id: runner-backed-without-product-binding-version
    input: {profile: runner-backed, product_binding_id: product-review-workflow, runner_id: product-review-runner, runner_version: 2.1.0, schemas_compatible: true, invocation: "product-review run --profile convergence", fresh_gate_evidence: true}
    expected: stop-unavailable
  - id: runner-backed-without-version
    input: {profile: runner-backed, product_binding_id: product-review-workflow, product_binding_version: 1.0.0, runner_id: product-review-runner, schemas_compatible: true, invocation: "product-review run --profile convergence", fresh_gate_evidence: true}
    expected: stop-unavailable
  - id: runner-backed-with-digest-only
    input: {profile: runner-backed, product_binding_id: product-review-workflow, product_binding_version: 1.0.0, runner_id: product-review-runner, runner_version: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", schemas_compatible: true, invocation: "product-review run --profile convergence", fresh_gate_evidence: true}
    expected: stop-unavailable
  - id: runner-backed-without-exact-invocation
    input: {profile: runner-backed, product_binding_id: product-review-workflow, product_binding_version: 1.0.0, runner_id: product-review-runner, runner_version: 2.1.0, schemas_compatible: true, fresh_gate_evidence: true}
    expected: stop-unavailable
  - id: runner-backed-without-fresh-evidence
    input: {profile: runner-backed, product_binding_id: product-review-workflow, product_binding_version: 1.0.0, runner_id: product-review-runner, runner_version: 2.1.0, schemas_compatible: true, invocation: "product-review run --profile convergence", fresh_gate_evidence: false}
    expected: stop-unavailable
