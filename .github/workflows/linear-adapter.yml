name: Linear adapter

on:
  pull_request:
    paths:
      - 'packages/hex-linear/**'
      - '.github/workflows/linear-adapter.yml'
  push:
    branches: [main]
    paths:
      - 'packages/hex-linear/**'
      - '.github/workflows/linear-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linear-adapter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and test dependencies
        run: python -m pip install './packages/hex-linear[test]'
      - name: Test installed package
        run: python -m pytest packages/hex-linear/tests -q
      - name: Validate provider documents against pinned schema
        shell: bash
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/linear-schema.graphql" \
            https://raw.githubusercontent.com/linear/linear/41cff77b3a62d93a30c3c3ceabc92ab77333f9da/packages/sdk/src/schema.graphql
          echo "dcfdea8bdd8134d5afa7a7161d78c60c67e10290a4434d4ffaa61ca4ba63aeb7  $RUNNER_TEMP/linear-schema.graphql" | sha256sum --check -
          python packages/hex-linear/scripts/check_schema.py "$RUNNER_TEMP/linear-schema.graphql"
      - name: Build and verify wheel import
        shell: bash
        run: |
          python -m pip wheel --no-deps ./packages/hex-linear --wheel-dir "$RUNNER_TEMP/linear-wheel"
          python -m pip install --no-deps --force-reinstall "$RUNNER_TEMP"/linear-wheel/*.whl
          python -c 'from hex_linear import LinearClient, LinearError, IssueFilter'
