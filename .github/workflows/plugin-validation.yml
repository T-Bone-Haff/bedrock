name: Plugin validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_live_routing:
        description: Run the authenticated Claude routing adapter
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: validation/requirements.txt
      - name: Install validation dependencies
        run: python -m pip install -r validation/requirements.txt
      - name: Install pinned Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.224
      - name: Run seeded validator tests
        run: python -m unittest discover -s tests -v
      - name: Run strict package validation
        run: python scripts/validate_plugin.py
      - name: Run isolated install and reload smoke test
        run: bash scripts/smoke_clean_install.sh

  live-routing:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_live_routing)
    needs: deterministic
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: python -m pip install -r validation/requirements.txt
      - name: Install pinned Claude Code adapter
        run: npm install --global @anthropic-ai/claude-code@2.1.224
      - name: Run repeated routing regression suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >-
          python scripts/run_routing_evals.py
          --runs ${{ github.event_name == 'pull_request' && 1 || 3 }}
          --output docs/evidence/heb-108/routing-results.json
      - name: Retain routing results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: heb-108-routing-results
          path: docs/evidence/heb-108/routing-results.json
          if-no-files-found: error
