[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hex-linear"
version = "0.2.0"
description = "Small typed Linear API client for Agents of HEX"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28.1,<0.29"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "graphql-core==3.2.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hex_linear = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
