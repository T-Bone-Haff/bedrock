apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: unsafe-app
spec:
  selector:
    matchLabels: {app: unsafe-app}
  serviceName: unsafe-app
  template:
    metadata:
      labels: {app: unsafe-app}
    spec:
      containers:
        - name: app
          image: us-docker.pkg.dev/example/app:latest
          securityContext:
            runAsNonRoot: false
