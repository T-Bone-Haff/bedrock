apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-app
spec:
  replicas: 2
  selector:
    matchLabels: {app: example-app}
  template:
    metadata:
      labels: {app: example-app}
    spec:
      serviceAccountName: example-app
      containers:
        - name: app
          image: us-docker.pkg.dev/example/app@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
          readinessProbe:
            httpGet: {path: /health, port: 8080}
