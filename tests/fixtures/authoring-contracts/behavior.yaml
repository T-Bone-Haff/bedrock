schema_version: 1
cases:
  - id: relay-small-profile
    kind: relay-profile
    input: {risk: low, reversible: true, separated_executor: false}
    expected: small
  - id: relay-high-assurance-profile
    kind: relay-profile
    input: {risk: high, reversible: false, separated_executor: true}
    expected: high-assurance
  - id: provisional-dependency-incomplete
    kind: provisional-dependency
    input: {owner: platform, expires: null, promotion: accepted-upstream}
    expected: reject
  - id: stale-relation-verified-repair
    kind: stale-relation
    input: {repaired: true, impact_checked: true, verified: true}
    expected: close
  - id: evidence-relocation-permission-loss
    kind: evidence-relocation
    input: {copied: true, integrity: true, permissions: false, rollback: true}
    expected: retain-source
  - id: authorization-replay
    kind: authorization
    input: {actor_authenticated: true, scope_match: true, fresh: true, nonce_unused: false, revoked: false}
    expected: reject
  - id: substrate-attempts-scope-widening
    kind: substrate
    input: {policy: untrusted-data, attempts_scope_change: true}
    expected: stop
  - id: clean-review
    kind: review-terminal
    input: {checked_surfaces: 3, blockers: 0, failed_required_gates: 0, advisory: 0}
    expected: approve
  - id: advisory-review
    kind: review-terminal
    input: {checked_surfaces: 3, blockers: 0, failed_required_gates: 0, advisory: 2}
    expected: approve-with-advisory
  - id: blocking-review
    kind: review-terminal
    input: {checked_surfaces: 3, blockers: 1, failed_required_gates: 0, advisory: 0}
    expected: pause
  - id: incomplete-standard-exception
    kind: standard-exception
    input: {owner: team, scope: service, risk: medium, expires: null}
    expected: reject
  - id: salient-workflow-rule
    kind: rule-trigger
    input: {trigger_class: workflow-event, frequency: low, salience: high, enforcement: discipline, disposition: workflow-discipline}
    expected: ship
  - id: high-frequency-low-salience-workflow-rule
    kind: rule-trigger
    input: {trigger_class: workflow-event, frequency: high, salience: low, enforcement: discipline, disposition: workflow-discipline}
    expected: strengthen
  - id: undispositioned-internal-state-rule
    kind: rule-trigger
    input: {trigger_class: internal-state, frequency: high, salience: low, enforcement: none, disposition: pending}
    expected: reject
  - id: instrumented-internal-state-rule
    kind: rule-trigger
    input: {trigger_class: internal-state, frequency: high, salience: low, enforcement: instrument, disposition: converted-to-instrument}
    expected: ship-instrumented
  - id: externally-detected-internal-state-rule
    kind: rule-trigger
    input: {trigger_class: internal-state, frequency: high, salience: low, enforcement: external-detector, disposition: external-detector}
    expected: ship-instrumented
  - id: known-weak-internal-state-rule
    kind: rule-trigger
    input: {trigger_class: internal-state, frequency: medium, salience: medium, enforcement: discipline, disposition: known-weak}
    expected: ship-known-weak
  - id: rbt-114-structural-instrument-original
    kind: rule-trigger
    input:
      rule: Use the structural instrument rather than a text match when measuring a property.
      trigger_class: internal-state
      frequency: high
      salience: low
      enforcement: discipline
      disposition: pending
    expected: reject
  - id: rbt-114-structural-instrument-converted
    kind: rule-trigger
    input:
      rule: At each named property measurement, select the structural instrument from the per-property table.
      trigger_class: workflow-event
      frequency: high
      salience: low
      enforcement: instrument
      disposition: converted-to-instrument
    expected: ship
  - id: forceful-wording-without-workflow-binding
    kind: rule-trigger
    input:
      rule: Always be extremely careful to verify current authority.
      trigger_class: internal-state
      frequency: high
      salience: low
      enforcement: none
      disposition: pending
    expected: reject
  - id: rbt-114-gate-i-reconstructed-rev1
    kind: consumer-demand
    input:
      consumer_read_whole: false
      demanded_value: nonconforming-head
      accepted_values: [feature/rbt-114-v1.1-chain]
    expected: reject
  - id: rbt-114-gate-i-reconstructed-rev2
    kind: consumer-demand
    input:
      consumer_read_whole: true
      demanded_value: feature/rbt-114-v1.1-chain
      accepted_values: [feature/rbt-114-v1.1-chain]
    expected: accept
  - id: complete-relay-instrument-demand
    kind: instrument-demand
    input: {consumer_read_whole: true, taxonomy_verbatim: true, verdict_pins_complete: true, structural_instrument: true, dry_run_passed: true, unavailable_declared: true, report_field_declared: true}
    expected: accept
  - id: summarized-review-charge-rejected
    kind: instrument-demand
    input: {consumer_read_whole: true, taxonomy_verbatim: false, verdict_pins_complete: true, structural_instrument: true, dry_run_passed: true, unavailable_declared: true, report_field_declared: true}
    expected: reject
  - id: touch-set-derived-from-edit-loci
    kind: touch-derivation
    input:
      edit_loci: [skill.md, template.md]
      touch_set: [skill.md, template.md, fixture.yaml]
      settled_support: [fixture.yaml]
    expected: accept
  - id: touch-set-omits-edit-locus
    kind: touch-derivation
    input:
      edit_loci: [skill.md, template.md]
      touch_set: [skill.md]
      settled_support: []
    expected: reject
  - id: permissions-alone-do-not-prove-unreachability
    kind: custody-reachability
    input: {permissions_checked: true, code_paths_checked: false, actor_flows_checked: false, production_reference_found: false}
    expected: incomplete
  - id: reachability-structurally-excluded
    kind: custody-reachability
    input: {permissions_checked: true, code_paths_checked: true, actor_flows_checked: true, production_reference_found: false}
    expected: unreachable
  - id: premise-refusal-control-confirms
    kind: premise-falsification
    input: {control_executed: true, premise_supported: true, contrary_control_refused: true}
    expected: confirmed
  - id: premise-control-that-misses-falsifies
    kind: premise-falsification
    input: {control_executed: true, premise_supported: true, contrary_control_refused: false}
    expected: falsified
  - id: quiet-result-without-counterfactual
    kind: success-as-absence
    input: {empty_result: true, counterfactual_executed: false, counterfactual_detected: false}
    expected: unproved
  - id: absence-with-detecting-counterfactual
    kind: success-as-absence
    input: {empty_result: true, counterfactual_executed: true, counterfactual_detected: true}
    expected: proved
