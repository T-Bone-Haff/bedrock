schema_version: 1
cases:
  - id: relay-small-profile
    kind: relay-profile
    input: {risk: low, reversible: true, separated_executor: false}
    expected: small
  - id: relay-high-assurance-profile
    kind: relay-profile
    input: {risk: high, reversible: false, separated_executor: true}
    expected: high-assurance
  - id: provisional-dependency-incomplete
    kind: provisional-dependency
    input: {owner: platform, expires: null, promotion: accepted-upstream}
    expected: reject
  - id: stale-relation-verified-repair
    kind: stale-relation
    input: {repaired: true, impact_checked: true, verified: true}
    expected: close
  - id: evidence-relocation-permission-loss
    kind: evidence-relocation
    input: {copied: true, integrity: true, permissions: false, rollback: true}
    expected: retain-source
  - id: authorization-replay
    kind: authorization
    input: {actor_authenticated: true, scope_match: true, fresh: true, nonce_unused: false, revoked: false}
    expected: reject
  - id: substrate-attempts-scope-widening
    kind: substrate
    input: {policy: untrusted-data, attempts_scope_change: true}
    expected: stop
  - id: clean-review
    kind: review-terminal
    input: {checked_surfaces: 3, blockers: 0, failed_required_gates: 0, advisory: 0}
    expected: approve
  - id: advisory-review
    kind: review-terminal
    input: {checked_surfaces: 3, blockers: 0, failed_required_gates: 0, advisory: 2}
    expected: approve-with-advisory
  - id: blocking-review
    kind: review-terminal
    input: {checked_surfaces: 3, blockers: 1, failed_required_gates: 0, advisory: 0}
    expected: pause
  - id: incomplete-standard-exception
    kind: standard-exception
    input: {owner: team, scope: service, risk: medium, expires: null}
    expected: reject
  - id: salient-workflow-rule
    kind: rule-trigger
    input: {trigger_class: workflow-event, frequency: low, salience: high, enforcement: discipline, disposition: workflow-discipline}
    expected: ship
  - id: high-frequency-low-salience-workflow-rule
    kind: rule-trigger
    input: {trigger_class: workflow-event, frequency: high, salience: low, enforcement: discipline, disposition: workflow-discipline}
    expected: strengthen
  - id: undispositioned-internal-state-rule
    kind: rule-trigger
    input: {trigger_class: internal-state, frequency: high, salience: low, enforcement: none, disposition: pending}
    expected: reject
  - id: instrumented-internal-state-rule
    kind: rule-trigger
    input: {trigger_class: internal-state, frequency: high, salience: low, enforcement: instrument, disposition: converted-to-instrument}
    expected: ship-instrumented
  - id: externally-detected-internal-state-rule
    kind: rule-trigger
    input: {trigger_class: internal-state, frequency: high, salience: low, enforcement: external-detector, disposition: external-detector}
    expected: ship-instrumented
  - id: known-weak-internal-state-rule
    kind: rule-trigger
    input: {trigger_class: internal-state, frequency: medium, salience: medium, enforcement: discipline, disposition: known-weak}
    expected: ship-known-weak
  - id: rbt-114-structural-instrument-original
    kind: rule-trigger
    input:
      rule: Use the structural instrument rather than a text match when measuring a property.
      trigger_class: internal-state
      frequency: high
      salience: low
      enforcement: discipline
      disposition: pending
    expected: reject
  - id: rbt-114-structural-instrument-converted
    kind: rule-trigger
    input:
      rule: At each named property measurement, select the structural instrument from the per-property table.
      trigger_class: workflow-event
      frequency: high
      salience: low
      enforcement: instrument
      disposition: converted-to-instrument
    expected: ship
  - id: forceful-wording-without-workflow-binding
    kind: rule-trigger
    input:
      rule: Always be extremely careful to verify current authority.
      trigger_class: internal-state
      frequency: high
      salience: low
      enforcement: none
      disposition: pending
    expected: reject
